name: .NET build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-archive:
    name: Build, test, and archive
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore SolutionName.sln

      - name: Build solution
        shell: pwsh
        run: msbuild SolutionName.sln /p:Configuration=Release /p:Platform="Any CPU" /p:ProductVersion="1.0.0.${{ github.run_number }}"

      - name: Run tests
        shell: pwsh
        run: vstest.console.exe ProjectName.Tests\bin\Release\ProjectName.Tests.dll /Logger:trx

      - name: Publish test results
        if: always()
        shell: pwsh
        run: |
          $results = Get-ChildItem -Path . -Recurse -Filter *.trx
          if (-not $results) {
            Write-Host 'No TRX test result files found.'
            exit 0
          }
          $destination = Join-Path $env:RUNNER_TEMP 'test-results'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $results | Copy-Item -Destination $destination

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: ${{ runner.temp }}\test-results\*.trx
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-release
          path: ProjectName/bin/Release/**/*
          if-no-files-found: error

      - name: Upload build report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-report
          path: ProjectName/bin/Release/index.html
          if-no-files-found: error

  deploy:
    name: Deploy to master target
    needs: build-test-archive
    if: github.ref == 'refs/heads/master'
    runs-on:
      - self-hosted
      - Windows

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: project-release
          path: ProjectName\bin\Release

      - name: Deploy to master target
        shell: pwsh
        run: xcopy ProjectName\bin\Release\* C:\Deploy\ProjectName\ /E /Y
